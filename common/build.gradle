plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id "org.jetbrains.kotlin.kapt"
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly "net.neoforged:neoforge:${neoforge_version}"

    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:${kotlinx_coroutines_version}"
    compileOnly "org.jetbrains.kotlinx:kotlinx-serialization-core:${kotlinx_serialization_version}"
    compileOnly "org.jetbrains.kotlinx:kotlinx-serialization-json:${kotlinx_serialization_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-reflect:2.2.20"
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
    commonKotlin {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
    commonKotlin file("src/main/kotlin")
}
repositories {
    mavenCentral()
}

