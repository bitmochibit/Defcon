plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    runtimeOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    jarJar(group: 'com.tterrag.registrate', name: 'Registrate', version: "[MC1.21-1.3.0+67]")
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${kotlinx_coroutines_version}"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-core:${kotlinx_serialization_version}"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${kotlinx_serialization_version}"
    implementation 'io.github.classgraph:classgraph:4.8.179'
    jarJar(group: 'io.github.classgraph', name: 'classgraph', version: "[4.8.179,5)")
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
